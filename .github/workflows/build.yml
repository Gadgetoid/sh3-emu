name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: brew install sdl3 libslirp pkgconf
      - name: Version
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else echo "VERSION=0.1+git$(date +%Y%m%d).$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"; fi
      - name: Build
        run: make all sh3emu
      - name: Check
        run: make check
      - name: App
        run: |
          make app
          ditto -c -k --keepParent SH3Emu.app "SH3Emu-${VERSION}-macos-$(uname -m).zip"
      - uses: actions/upload-artifact@v7
        with:
          name: sh3emu-macos
          path: SH3Emu-*.zip

  debian:
    runs-on: ubuntu-latest
    container: debian:bookworm
    env:
      SDL_STATIC: 1
      PKG_CONFIG_PATH: /opt/sdl3/lib/pkgconfig
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential pkg-config dpkg-dev git ca-certificates python3 curl cmake \
            libslirp-dev libglib2.0-dev zlib1g-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libegl-dev libgl-dev libdbus-1-dev libudev-dev
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Version
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else echo "VERSION=0.1+git$(date +%Y%m%d).$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"; fi
      - name: SDL3
        run: sh tools/sdl3-static.sh /opt/sdl3
      - name: Build
        run: make all sh3emu
      - name: Check
        run: make check
      - name: Package
        run: sh tools/mkdeb.sh dist
      - uses: actions/upload-artifact@v7
        with:
          name: sh3emu-debian
          path: dist/*.deb

  release:
    if: github.ref_type == 'tag'
    needs: [macos, debian]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            *.zip
            *.deb
